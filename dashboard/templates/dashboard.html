<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LLM Security Dashboard</title>
  <meta name="description" content="Real-time security monitoring dashboard for the LLM prompt injection detection system."/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0f1a;
      --surface:   #141828;
      --surface2:  #1c2035;
      --border:    #252a40;
      --text:      #e2e8f0;
      --muted:     #7b8ab8;
      --accent:    #6366f1;
      --accent2:   #818cf8;
      --safe:      #22c55e;
      --warn:      #f59e0b;
      --danger:    #ef4444;
      --radius:    12px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── TOP NAV ── */
    nav {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 32px;
      border-bottom: 1px solid var(--border);
      background: rgba(20,24,40,0.9);
      backdrop-filter: blur(12px);
      position: sticky; top: 0; z-index: 100;
    }
    .nav-logo { font-size: 1.2rem; font-weight: 700; }
    .nav-logo span { color: var(--accent2); }
    .nav-pill {
      margin-left: auto;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 14px;
      font-size: .78rem;
      color: var(--muted);
      display: flex; align-items: center; gap: 6px;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--safe); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* ── LAYOUT ── */
    main { max-width: 1280px; margin: 0 auto; padding: 32px 24px; }
    h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 6px; }
    .subtitle { color: var(--muted); font-size: .9rem; margin-bottom: 28px; }

    /* ── STAT CARDS ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 22px;
      position: relative;
      overflow: hidden;
      transition: transform .2s, border-color .2s;
    }
    .stat-card:hover { transform: translateY(-3px); border-color: var(--accent); }
    .stat-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
    }
    .stat-card.total::before  { background: linear-gradient(90deg, var(--accent), var(--accent2)); }
    .stat-card.safe::before   { background: var(--safe); }
    .stat-card.monitor::before{ background: var(--warn); }
    .stat-card.danger::before { background: var(--danger); }

    .stat-label { font-size: .78rem; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .05em; }
    .stat-value { font-size: 2.4rem; font-weight: 700; margin-top: 6px; line-height: 1; }
    .stat-card.safe .stat-value    { color: var(--safe); }
    .stat-card.monitor .stat-value { color: var(--warn); }
    .stat-card.danger .stat-value  { color: var(--danger); }
    .stat-card.total .stat-value   { color: var(--accent2); }
    .stat-sub { font-size: .78rem; color: var(--muted); margin-top: 4px; }

    /* ── CHARTS GRID ── */
    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 28px;
    }
    @media (max-width: 768px) { .charts-grid { grid-template-columns: 1fr; } }

    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
    }
    .chart-card h2 {
      font-size: .95rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--text);
    }
    .chart-card canvas { max-height: 240px; }

    /* ── RECENT TABLE ── */
    .table-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      overflow: hidden;
    }
    .table-card h2 {
      font-size: .95rem;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .83rem; }
    th {
      text-align: left;
      padding: 8px 12px;
      color: var(--muted);
      font-weight: 500;
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: .05em;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      vertical-align: top;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface2); }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: .72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .badge.SAFE      { background: rgba(34,197,94,.15);  color: var(--safe); }
    .badge.MONITOR   { background: rgba(245,158,11,.15); color: var(--warn); }
    .badge.DECEPTION { background: rgba(239,68,68,.15);  color: var(--danger); }

    .prompt-cell {
      max-width: 320px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--muted);
    }
    .cat-tag {
      display: inline-block;
      background: rgba(99,102,241,.15);
      color: var(--accent2);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: .7rem;
      margin: 1px 2px;
    }

    /* ── LOADING SKELETON ── */
    .skeleton {
      background: linear-gradient(90deg, var(--surface2) 25%, var(--border) 50%, var(--surface2) 75%);
      background-size: 400% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
      height: 42px;
    }
    @keyframes shimmer { 0%{background-position:100% 0} 100%{background-position:-100% 0} }

    /* ── REFRESH BUTTON ── */
    .refresh-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 18px;
      font-size: .85rem;
      font-weight: 500;
      cursor: pointer;
      transition: background .2s, transform .1s;
      margin-left: auto;
      display: block;
      margin-bottom: 16px;
    }
    .refresh-btn:hover { background: var(--accent2); transform: scale(1.02); }
    .refresh-btn:active { transform: scale(.98); }
  </style>
</head>
<body>

<nav>
  <div class="nav-logo">🛡️ LLM <span>Security</span></div>
  <div class="nav-pill">
    <div class="dot"></div> Live Monitoring
  </div>
</nav>

<main>
  <h1>Security Dashboard</h1>
  <p class="subtitle">Real-time overview of prompt injection attempts, blocked requests, and threat patterns.</p>

  <button class="refresh-btn" onclick="loadDashboard()">⟳ Refresh</button>

  <!-- STAT CARDS -->
  <div class="stats-grid" id="stats-grid">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>

  <!-- CHARTS -->
  <div class="charts-grid">
    <div class="chart-card">
      <h2>📊 Requests Over Time</h2>
      <canvas id="timelineChart"></canvas>
    </div>
    <div class="chart-card">
      <h2>🎯 Risk Distribution</h2>
      <canvas id="donutChart"></canvas>
    </div>
    <div class="chart-card">
      <h2>🏷️ Attack Categories</h2>
      <canvas id="catChart"></canvas>
    </div>
    <div class="chart-card">
      <h2>🌐 Top Attacking IPs</h2>
      <canvas id="ipChart"></canvas>
    </div>
  </div>

  <!-- RECENT EVENTS TABLE -->
  <div class="table-card">
    <h2>🕵️ Recent Events</h2>
    <div class="table-wrap">
      <table id="events-table">
        <thead>
          <tr>
            <th>Time</th>
            <th>IP</th>
            <th>Prompt</th>
            <th>Score</th>
            <th>Mode</th>
            <th>Categories</th>
          </tr>
        </thead>
        <tbody id="events-body">
          <tr><td colspan="6"><div class="skeleton" style="height:28px"></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<script>
let timelineChart, donutChart, catChart, ipChart;

const CHART_DEFAULTS = {
  responsive: true,
  maintainAspectRatio: true,
  plugins: { legend: { labels: { color: '#7b8ab8', font: { family: 'Inter', size: 12 } } } }
};

function fmt(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  return d.toLocaleString('en-IN', { dateStyle: 'short', timeStyle: 'short' });
}

function buildStatCards(data) {
  const pct = (n) => data.total_requests ? ((n / data.total_requests) * 100).toFixed(1) + '%' : '0%';
  document.getElementById('stats-grid').innerHTML = `
    <div class="stat-card total">
      <div class="stat-label">Total Requests</div>
      <div class="stat-value">${data.total_requests}</div>
      <div class="stat-sub">all time</div>
    </div>
    <div class="stat-card safe">
      <div class="stat-label">Safe</div>
      <div class="stat-value">${data.safe_count}</div>
      <div class="stat-sub">${pct(data.safe_count)} of traffic</div>
    </div>
    <div class="stat-card monitor">
      <div class="stat-label">Monitored</div>
      <div class="stat-value">${data.monitor_count}</div>
      <div class="stat-sub">${pct(data.monitor_count)} of traffic</div>
    </div>
    <div class="stat-card danger">
      <div class="stat-label">Deception Triggered</div>
      <div class="stat-value">${data.deception_count}</div>
      <div class="stat-sub">${pct(data.deception_count)} of traffic</div>
    </div>
  `;
}

function buildTimeline(data) {
  const labels = Object.keys(data.events_per_day);
  const values = Object.values(data.events_per_day);
  const ctx = document.getElementById('timelineChart').getContext('2d');
  if (timelineChart) timelineChart.destroy();
  timelineChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Requests',
        data: values,
        borderColor: '#6366f1',
        backgroundColor: 'rgba(99,102,241,0.12)',
        fill: true,
        tension: 0.4,
        pointBackgroundColor: '#818cf8',
        pointRadius: 4,
      }]
    },
    options: { ...CHART_DEFAULTS, scales: {
      x: { ticks: { color: '#7b8ab8' }, grid: { color: '#252a40' } },
      y: { ticks: { color: '#7b8ab8' }, grid: { color: '#252a40' } }
    }}
  });
}

function buildDonut(data) {
  const ctx = document.getElementById('donutChart').getContext('2d');
  if (donutChart) donutChart.destroy();
  donutChart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: ['Safe', 'Monitor', 'Deception'],
      datasets: [{
        data: [data.safe_count, data.monitor_count, data.deception_count],
        backgroundColor: ['rgba(34,197,94,.7)', 'rgba(245,158,11,.7)', 'rgba(239,68,68,.7)'],
        borderColor: '#141828',
        borderWidth: 3,
      }]
    },
    options: { ...CHART_DEFAULTS, cutout: '65%' }
  });
}

function buildCatChart(data) {
  const cats = data.top_categories;
  const labels = Object.keys(cats);
  const values = Object.values(cats);
  const ctx = document.getElementById('catChart').getContext('2d');
  if (catChart) catChart.destroy();
  catChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: 'Count',
        data: values,
        backgroundColor: ['rgba(99,102,241,.7)', 'rgba(239,68,68,.7)', 'rgba(245,158,11,.7)'],
        borderRadius: 6,
      }]
    },
    options: { ...CHART_DEFAULTS, indexAxis: 'y', scales: {
      x: { ticks: { color: '#7b8ab8' }, grid: { color: '#252a40' } },
      y: { ticks: { color: '#e2e8f0' }, grid: { color: '#252a40' } }
    }, plugins: { ...CHART_DEFAULTS.plugins, legend: { display: false } } }
  });
}

function buildIpChart(data) {
  const ips = data.top_ips;
  const labels = Object.keys(ips);
  const values = Object.values(ips);
  const ctx = document.getElementById('ipChart').getContext('2d');
  if (ipChart) ipChart.destroy();
  ipChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: 'Requests',
        data: values,
        backgroundColor: 'rgba(129,140,248,.65)',
        borderRadius: 6,
      }]
    },
    options: { ...CHART_DEFAULTS, scales: {
      x: { ticks: { color: '#7b8ab8' }, grid: { color: '#252a40' } },
      y: { ticks: { color: '#e2e8f0' }, grid: { color: '#252a40' } }
    }, plugins: { ...CHART_DEFAULTS.plugins, legend: { display: false } } }
  });
}

function buildTable(events) {
  const tbody = document.getElementById('events-body');
  if (!events || events.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" style="color:#7b8ab8;text-align:center;padding:24px">No events logged yet.</td></tr>';
    return;
  }
  tbody.innerHTML = events.map(e => {
    const cats = (e.categories || 'none').split('|').filter(c => c && c !== 'none');
    const catHtml = cats.length ? cats.map(c => `<span class="cat-tag">${c}</span>`).join('') : '<span style="color:#4b5563">—</span>';
    return `
      <tr>
        <td style="white-space:nowrap;color:#7b8ab8">${fmt(e.timestamp)}</td>
        <td style="color:#7b8ab8;font-size:.78rem">${e.ip_address || '—'}</td>
        <td class="prompt-cell" title="${e.prompt}">${e.prompt || '—'}</td>
        <td><strong style="color:${e.risk_score >= 4 ? '#ef4444' : e.risk_score > 0 ? '#f59e0b' : '#22c55e'}">${e.risk_score}</strong></td>
        <td><span class="badge ${e.risk_mode}">${e.risk_mode}</span></td>
        <td>${catHtml}</td>
      </tr>`;
  }).join('');
}

async function loadDashboard() {
  try {
    const res = await fetch('/stats');
    const data = await res.json();
    buildStatCards(data);
    buildTimeline(data);
    buildDonut(data);
    buildCatChart(data);
    buildIpChart(data);
    buildTable(data.recent_events);
  } catch (err) {
    console.error('Failed to load stats:', err);
  }
}

// Auto-refresh every 30 seconds
loadDashboard();
setInterval(loadDashboard, 30_000);
</script>
</body>
</html>
